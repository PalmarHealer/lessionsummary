services:
  worker:
    # Built by CI on pushes to main that touch worker/; `up --build` builds locally.
    image: ghcr.io/palmarhealer/lessionsummary-worker:${LS_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    # Remove the reservation (and set WHISPER_DEVICE=cpu) for a CPU-only box.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Model weights (~3 GB for large-v3 + pyannote + wav2vec2) survive rebuilds.
      - hf-cache:/cache

volumes:
  hf-cache:
