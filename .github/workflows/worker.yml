name: Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q worker/lessionsummary_worker

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      # CUDA + cuDNN + torch come to ~8 GB unpacked; the stock runner has
      # about 14 GB free, which the build's intermediate layers exceed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lessionsummary-worker
          tags: |
            type=raw,value=latest
            type=sha,format=long
      # No GHA layer cache: the torch layer alone would blow the 10 GB
      # cache quota and evict everything else.
      - uses: docker/build-push-action@v6
        with:
          context: worker
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
